# 01_BACKEND_CONTRACT.md §7 — authoritative runtime configuration.
cycle_sec: 30
demo_seed: 42
# City simulator implementation (see app/ml_reference/city_model.py).
city_model: flow

# 10x: one 30-sim-second cycle every 3 wall seconds. Operators need time to
# read, review and act on a recommendation (see `interventions` below).
speed_multiplier: 10

thresholds:
  critical_utilisation: 0.90
  warning_utilisation: 0.75
  risk_bands: { low: 30, moderate: 60, high: 80 }
  band_hold_cycles: 3   # a lower severity band must hold this many cycles before it is shown (no flicker)
  post_change_no_hold_cycles: 10   # after an operator change, bands follow the model directly for this long
  # Entity types whose normal operating point is near full: a sold-out venue
  # or a well-booked hotel is the plan, not an emergency.
  by_type:
    venue: { warning: 0.97, critical: 1.02 }
    hotel: { warning: 0.92, critical: 0.98 }

forecaster:
  horizons_sec: [900, 1800, 3600]
  tsfm_model: "amazon/chronos-bolt-small"
  tsfm_enabled: true
  warm_start_after_points: 40
  model_refresh_cycles: 4       # how often the twin-model projection behind forecasts is recomputed
  device: "cpu"
  # Forecast correction (ML/forecast_correction.py): LightGBM quantile models of the
  # twin model's residual, served as source "local_model". Loaded only from a
  # verified bundle whose eval.json gate passed (scripts/train_forecast_correction.py);
  # null serves the twin model. v2 passed (ML/evaluation/results/forecast_correction_v2.json).
  correction_artifact: "ML/artifacts/forecast_correction_v2"
  correction_gate:
    ttc_max_error_sec: 180      # 03 §2.5, on the demo scenario

cascade:
  use_gnn: true
  max_depth: 4
  propagation_threshold: 0.15
  # Verified model bundle (manifest.json binds model.pt, feature_norm.json, eval.json
  # by sha256; a mismatch means the model is not loaded and gnn_mode reads "off").
  gnn_artifact: "ML/artifacts/hx_cascade_v3"
  # What the loaded GNN is allowed to do. The cascade itself is always the
  # deterministic flow cascade (services/cascade_flow.py).
  #   shadow   - the model runs every cycle, its predictions are kept for
  #              evaluation, nothing published or decided uses them (default;
  #              a model leaves shadow only through `swap_gate` below)
  #   annotate - model probabilities are attached to cascade steps as `confidence`
  #              on every cascade path (live, /cascade/{id}, What-If)
  #   off      - the model is not called
  # annotate: hx_cascade_v3 passed `swap_gate` (Phase 4; evidence in ML/evaluation/results/)
  gnn_mode: annotate
  # Output hygiene: a cascade is only useful if an operator can read it.
  max_roots: 5              # most severe roots per cycle
  max_steps: 8              # downstream steps kept per cascade (highest probability first)
  gnn_min_probability: 0.6  # GNN steps below this are not reported as failures
                            # (alerts use the bundle's own eval.json operating point when it has one)
  # 03 §4.3/§4.4 swap gate (tests/test_cascade_swap_gate.py, evidence from
  # scripts/cascade_swap_eval.py): `annotate` is allowed only for a bundle that
  # passes it on held-out maps AND in a full-event shadow run.
  swap_gate:
    min_precision: 0.75     # at the 3600 s horizon (03 §4.4)
    min_recall: 0.70
    max_ece: 0.05           # expected calibration error, every horizon
  exclude_root_types: ["hotel"]  # room occupancy does not propagate as crowd flow
  # Out-of-distribution guard (ML/cascade.py): the model is not used for a graph
  # that is not its training map (bundles with a topology_hash), or whose scored
  # entities leave the bundle's ood_stats.json. The reason is logged and shown
  # in /health.modules.cascade.fallback_reason. Measured on hx_cascade_v3's
  # 57 held-out test runs and 8 live-map runs: 0 out-of-range entities, at most
  # 35% of scored entities beyond the train p99 embedding distance.
  ood_guard:
    enabled: true
    range_tolerance: 0.05       # slack beyond the train min/max, as a share of that range
    max_embedding_frac: 0.5     # refuse when more scored entities than this sit beyond train p99

twin:
  ensemble_size: 20
  inflation_factor: 1.05
  # Observation noise the filter assumes = the simulator's sensor model
  # (generator: reading x (1 + U(-1.5%, +1.5%)), counts in whole people):
  # obs_noise_rel is the Gaussian sigma whose 90% interval matches that uniform's
  # (0.9 x 1.5% / 1.645); obs_noise_var ~ integer rounding. Measured 90% ensemble
  # coverage on the demo run: 0.93 (seed 42), 0.93 (seed 7); target 0.85-0.95 (03 §3.6).
  obs_noise_var: 1.0
  obs_noise_rel: 0.0082
  coverage_window: 20           # cycles pooled into the reported coverage
  process_noise_var: 9.0
  drift_mode_enabled: false

equilibrium:
  max_iterations: 40
  convergence_tol: 0.005
  damping: 0.5
  compliance_sweep: [0.4, 0.6, 0.9]
  alpha: 1.0
  beta: 2.5
  sigmoid_k: 3.0

optimiser:
  max_candidates: 5
  min_feasibility: 0.3
  weights: { relief: 0.45, stability: 0.30, cost: 0.15, delay: 0.10 }

risk:
  weights: { base: 0.5, growth: 0.3, cascade: 0.2 }
  # Additive escalations on top of the utilisation-derived floor (points of 100).
  max_growth_points: 15
  max_cascade_points: 10
  max_persistence_points: 5
  persistence_cycles_for_max: 20

anomaly:
  z_threshold: 3.0
  window: 20

commander:
  # No paid LLM API. The Commander answers from real tool-call results using
  # deterministic templates, so `ungrounded_count` is structurally 0 and the
  # demo costs nothing to run. Set LOCAL_LLM_URL (Ollama) to swap in a free
  # local model — the grounding validator runs identically either way.
  engine: "deterministic"        # "deterministic" | "local_llm"
  cache_scripted_queries: true
  strip_ungrounded_numbers: true

# Latency budgets in milliseconds (01 §2).
budgets_ms:
  assimilate: 200
  forecast: 300
  cascade: 150
  optimise: 200
  evaluate: 1500
  certify: 400
  broadcast: 50
  total_cap: 2000

# Operator-facing intervention lifecycle. A proposal must stay visible long
# enough to be read and acted on: its lifetime is the larger of `ttl_sec` of
# sim time and `min_wall_visible_sec` of wall time at the current speed, capped
# at `max_ttl_sec` so a stale proposal never lingers for hours of sim time.
interventions:
  ttl_sec: 1200
  min_wall_visible_sec: 120
  max_ttl_sec: 3600
  effect_duration_sec: 2700     # how long an approved action keeps acting on the city
  settle_delay_sec: 900         # when its realised effect is measured
  evaluation_horizon_sec: 1800  # what-if horizon used to estimate each candidate's relief
  evaluation_step_sec: 60
  max_live_proposals: 8
  min_relief_pct: 1.0           # candidates simulated below this relief are not proposed
  default_compliance: 0.6       # before any attendee has answered a nudge

# Compliance estimates from nudge answers (app/services/compliance.py): a
# Beta-Binomial posterior pooled (simulator) and per segment (equilibrium solver).
compliance:
  prior_strength: 10            # pseudo-answers behind each prior mean

# Visitor demand and movement (SyntheticGenerator flow model).
demand:
  arrival_lead_min: 40          # arrival peak this long before an event starts
  arrival_sd_min: 28
  egress_lag_min: 15            # egress peak this long after an event ends
  egress_sd_min: 10
  local_mode_split: { metro: 0.50, bus: 0.15, shuttle: 0.10, car: 0.25 }
  route_sensitivity: 1.5        # how strongly visitors avoid congested gates/stations
  persons_per_vehicle: 2.4
  rush_peak_elapsed_min: 240    # evening city rush (sim_start + 4h = 18:00)
  rush_sd_min: 70
  rush_amplitude: 0.45
  observed_fraction: 0.75       # share of roads/zones/parking/emergency posts with sensors
  sensor_dropout_rate: 0.03     # per-cycle probability an observed sensor misses a reading

hospitality:
  saturation_threshold: 0.95    # property occupancy at/above which it is saturated
  limited_threshold: 0.85
  guests_per_room: 2.2
  room_need_share: 0.34         # out-of-town attendees who need a room (others are day trips)
  prebooked_share: 0.55         # share of room demand already booked at sim start
  booking_window_min: 180       # remaining bookings arrive over this window

projection:
  horizon_sec: 5400
  step_sec: 60
  sample_sec: 300

attendee:
  departure_offsets_sec: [0, 900, 1800, 2700]
  arrival_buffer_sec: 600       # aim to arrive this long before an event starts
  min_crowding_gain: 0.05       # a later departure is advised only if it cuts peak crowding by this much
  # Travel time through a crowded road/zone/train: base x (1 + alpha x load^beta)
  # (the standard BPR volume-delay function), at the load projected for arrival time.
  congestion_alpha: 0.15
  congestion_beta: 4.0

# Geography provider for door-to-door travel times (app/providers/geo.py).
# synthetic = great-circle distance x street detour factor, per-mode speeds.
# osrm / google need OSRM_URL / GOOGLE_MAPS_API_KEY in the environment
# (EVENTFLOW_GEO_PROVIDER overrides `provider`); any failure falls back to synthetic.
geo:
  provider: synthetic
  timeout_sec: 2.0
  retries: 1
  cache_ttl_sec: 3600

# Static city data (app/providers/data.py). `file` reads events.json /
# hotels.json / topology.json from `dir` (each optional) and normalises them.
data:
  provider: synthetic
  dir: data

# The event schedule. `event` below stays the primary event (GET /event).
events:
  - event_id: "evt_demo"
    name: "National Cup Final"
    category: "sport"
    venue_entity_id: "stadium_main"
    start_time: "2026-09-04T16:00:00Z"
    end_time: "2026-09-04T18:30:00Z"
    expected_attendance: 70000
    out_of_town_share: 0.30
  - event_id: "evt_fanfest"
    name: "Fan Festival"
    category: "festival"
    venue_entity_id: "zone_fanpark"
    start_time: "2026-09-04T15:00:00Z"
    end_time: "2026-09-04T19:30:00Z"
    expected_attendance: 5500
    out_of_town_share: 0.10
  - event_id: "evt_expo"
    name: "Tech Expo Day 2"
    category: "conference"
    venue_entity_id: "convention_centre"
    start_time: "2026-09-04T12:00:00Z"
    end_time: "2026-09-04T17:00:00Z"
    expected_attendance: 14000
    out_of_town_share: 0.40

event:
  event_id: "evt_demo"
  name: "National Cup Final"
  venue_entity_id: "stadium_main"
  expected_attendance: 70000
  sim_start_time: "2026-09-04T14:00:00Z"
  start_time: "2026-09-04T16:00:00Z"
  end_time: "2026-09-04T18:30:00Z"
