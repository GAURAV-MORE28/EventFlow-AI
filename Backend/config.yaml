# 01_BACKEND_CONTRACT.md §7 — authoritative runtime configuration.
cycle_sec: 30
demo_seed: 42
# City simulator implementation (see app/ml_reference/city_model.py).
city_model: flow

# 10x: one 30-sim-second cycle every 3 wall seconds. Operators need time to
# read, review and act on a recommendation (see `interventions` below).
speed_multiplier: 10

thresholds:
  critical_utilisation: 0.90
  warning_utilisation: 0.75
  risk_bands: { low: 30, moderate: 60, high: 80 }
  band_hold_cycles: 3   # a lower severity band must hold this many cycles before it is shown (no flicker)
  post_change_no_hold_cycles: 10   # after an operator change, bands follow the model directly for this long
  # Entity types whose normal operating point is near full: a sold-out venue
  # or a well-booked hotel is the plan, not an emergency.
  by_type:
    venue: { warning: 0.97, critical: 1.02 }
    hotel: { warning: 0.92, critical: 0.98 }

forecaster:
  horizons_sec: [900, 1800, 3600]
  tsfm_model: "amazon/chronos-bolt-small"
  tsfm_enabled: true
  warm_start_after_points: 40
  model_refresh_cycles: 4       # how often the twin-model projection behind forecasts is recomputed
  device: "cpu"

cascade:
  use_gnn: true
  max_depth: 4
  propagation_threshold: 0.15
  gnn_checkpoint: "ML/hx_cascade_v2.pt"   # retrained on flow-sim data with forecast features; see ML/cascade_eval_v2.json
  # Output hygiene: a cascade is only useful if an operator can read it.
  max_roots: 5              # most severe roots per cycle
  max_steps: 8              # downstream steps kept per cascade (highest probability first)
  gnn_min_probability: 0.6  # GNN steps below this are not reported as failures
  exclude_root_types: ["hotel"]  # room occupancy does not propagate as crowd flow

twin:
  ensemble_size: 20
  inflation_factor: 1.05
  obs_noise_var: 25.0
  process_noise_var: 9.0
  drift_mode_enabled: false

equilibrium:
  max_iterations: 40
  convergence_tol: 0.005
  damping: 0.5
  compliance_sweep: [0.4, 0.6, 0.9]
  alpha: 1.0
  beta: 2.5
  sigmoid_k: 3.0

optimiser:
  max_candidates: 5
  min_feasibility: 0.3
  weights: { relief: 0.45, stability: 0.30, cost: 0.15, delay: 0.10 }

risk:
  weights: { base: 0.5, growth: 0.3, cascade: 0.2 }
  # Additive escalations on top of the utilisation-derived floor (points of 100).
  max_growth_points: 15
  max_cascade_points: 10
  max_persistence_points: 5
  persistence_cycles_for_max: 20

anomaly:
  z_threshold: 3.0
  window: 20

commander:
  # No paid LLM API. The Commander answers from real tool-call results using
  # deterministic templates, so `ungrounded_count` is structurally 0 and the
  # demo costs nothing to run. Set LOCAL_LLM_URL (Ollama) to swap in a free
  # local model — the grounding validator runs identically either way.
  engine: "deterministic"        # "deterministic" | "local_llm"
  cache_scripted_queries: true
  strip_ungrounded_numbers: true

# Latency budgets in milliseconds (01 §2).
budgets_ms:
  assimilate: 200
  forecast: 300
  cascade: 150
  optimise: 200
  evaluate: 1500
  certify: 400
  broadcast: 50
  total_cap: 2000

# Operator-facing intervention lifecycle. A proposal must stay visible long
# enough to be read and acted on: its lifetime is the larger of `ttl_sec` of
# sim time and `min_wall_visible_sec` of wall time at the current speed, capped
# at `max_ttl_sec` so a stale proposal never lingers for hours of sim time.
interventions:
  ttl_sec: 1200
  min_wall_visible_sec: 120
  max_ttl_sec: 3600
  effect_duration_sec: 2700     # how long an approved action keeps acting on the city
  settle_delay_sec: 900         # when its realised effect is measured
  evaluation_horizon_sec: 1800  # what-if horizon used to estimate each candidate's relief
  evaluation_step_sec: 60
  max_live_proposals: 8
  min_relief_pct: 1.0           # candidates simulated below this relief are not proposed
  default_compliance: 0.6       # before any attendee has answered a nudge

# Visitor demand and movement (SyntheticGenerator flow model).
demand:
  arrival_lead_min: 40          # arrival peak this long before an event starts
  arrival_sd_min: 28
  egress_lag_min: 15            # egress peak this long after an event ends
  egress_sd_min: 10
  local_mode_split: { metro: 0.50, bus: 0.15, shuttle: 0.10, car: 0.25 }
  route_sensitivity: 1.5        # how strongly visitors avoid congested gates/stations
  persons_per_vehicle: 2.4
  rush_peak_elapsed_min: 240    # evening city rush (sim_start + 4h = 18:00)
  rush_sd_min: 70
  rush_amplitude: 0.45
  observed_fraction: 0.75       # share of roads/zones/parking/emergency posts with sensors
  sensor_dropout_rate: 0.03     # per-cycle probability an observed sensor misses a reading

hospitality:
  saturation_threshold: 0.95    # property occupancy at/above which it is saturated
  limited_threshold: 0.85
  guests_per_room: 2.2
  room_need_share: 0.34         # out-of-town attendees who need a room (others are day trips)
  prebooked_share: 0.55         # share of room demand already booked at sim start
  booking_window_min: 180       # remaining bookings arrive over this window

projection:
  horizon_sec: 5400
  step_sec: 60
  sample_sec: 300

attendee:
  departure_offsets_sec: [0, 900, 1800, 2700]
  arrival_buffer_sec: 600       # aim to arrive this long before an event starts
  min_crowding_gain: 0.05       # a later departure is advised only if it cuts peak crowding by this much
  # Travel time through a crowded road/zone/train: base x (1 + alpha x load^beta)
  # (the standard BPR volume-delay function), at the load projected for arrival time.
  congestion_alpha: 0.15
  congestion_beta: 4.0

# Geography provider for door-to-door travel times (app/providers/geo.py).
# synthetic = great-circle distance x street detour factor, per-mode speeds.
# osrm / google need OSRM_URL / GOOGLE_MAPS_API_KEY in the environment
# (EVENTFLOW_GEO_PROVIDER overrides `provider`); any failure falls back to synthetic.
geo:
  provider: synthetic
  timeout_sec: 2.0
  retries: 1
  cache_ttl_sec: 3600

# --- Weather-driven digital twin (app/providers/weather.py + app/services/weather*.py) ---
# Live weather is fetched from Open-Meteo, which needs NO API key and no account,
# so the core demo runs against real observations out of the box.
#   provider: open_meteo | synthetic | none
#     open_meteo  real live data. On failure: the last good reading, labelled
#                 `cached`; with nothing cached, `unavailable` (never faked).
#     synthetic   deterministic offline model, always labelled `synthetic` —
#                 a plausible shape, never presented as an observation.
#     none        the weather layer reports `unavailable`.
#   EVENTFLOW_WEATHER_PROVIDER overrides `provider`.
#
# `drive_live: false` is deliberate. Weather is always fetched, always shown and
# always available to What-If, but it only becomes a modifier on the LIVE city
# when an operator switches it on (POST /weather/apply) — so `sim_time` stays
# fully determined by the seed, and the reproducible demo run does not depend on
# today's actual weather. Every payload reports `driving_live`.
#
# Every coefficient below is RULE-BASED: a documented estimate applied to a
# measured value, with k_min/k_max bounding it so the reported uncertainty band
# comes from the real coefficient range instead of an invented confidence
# number. `basis` on each rule (services/weather_impact.py) states where the
# figure comes from; nothing here is a fitted or learned parameter.
weather:
  provider: open_meteo
  refresh_sec: 900               # weather changes on the scale of minutes, not cycles
  forecast_hours: 12
  timeout_sec: 6.0
  retries: 1
  min_interval_sec: 1.0
  client_cache_ttl_sec: 120      # a burst of UI requests is one provider request
  stale_after_sec: 3600          # a cached reading older than this is flagged `stale`
  drive_live: false              # operator opt-in; see above
  user_agent: "EventFlow-AI/1.0 (hackathon demo; +https://github.com/)"
  # `provider: synthetic` only — the deterministic model's baseline. Lets an
  # offline run stand in for a particular kind of day (a heavy-rain demo, or
  # verifying the severe-weather UI paths) without touching code. It is still
  # reported as `synthetic`, never as an observation.
  # base: { rain_mm_per_hr: 26.0, temp_c: 31.0, wind_kph: 45.0 }

  # Severity bands. Rainfall = the standard hourly rain-rate classes; wind =
  # Beaufort 6 / 8 / 10 in km/h; apparent temperature = heat-stress estimates
  # (not a clinical index).
  severity:
    rain_mm_per_hr: { moderate: 2.5, severe: 7.6, extreme: 30.0 }
    wind_kph:       { moderate: 39.0, severe: 62.0, extreme: 88.0 }
    apparent_c:     { moderate: 35.0, severe: 40.0, extreme: 45.0 }

  # Reference intensities: the value at which a rule reaches its full effect.
  rain_ref_mm_per_hr: 25.0
  heat_onset_c: 32.0
  heat_ref_c: 45.0
  wind_onset_kph: 39.0
  wind_ref_kph: 88.0
  flood_onset: 0.05
  flood_closure_severity: 0.80   # at/above this, entities the operator NAMED close

  # Rain -> movement, service and capacity.
  rain_travel:      { k: 0.32, k_min: 0.20, k_max: 0.50 }
  rain_dwell:       { k: 0.22, k_min: 0.12, k_max: 0.35 }
  rain_service:     { k: 0.14, k_min: 0.08, k_max: 0.22 }
  rain_capacity:    { k: 0.18, k_min: 0.10, k_max: 0.28 }
  # Attendance elasticity for a TICKETED event is low: a ticket holder at a
  # sold-out final comes in the rain. Keep k small — a large value makes heavy
  # rain read as a relief measure, which is wrong.
  rain_attendance:  { k: 0.04, k_min: 0.01, k_max: 0.10 }
  rain_arrival_min: { k: 12.0, k_min: 4.0,  k_max: 22.0 }
  # Delayed arrivals BUNCH (correlated "wait out the shower" decisions), so the
  # arrival window narrows and the instantaneous peak rises. This is the
  # mechanism that makes rain worse rather than merely later.
  rain_bunching:    { k: 0.22, k_min: 0.10, k_max: 0.34 }
  # Extreme heat -> behaviour and medical load.
  heat_dwell:       { k: 0.18, k_min: 0.08, k_max: 0.30 }
  heat_attendance:  { k: 0.04, k_min: 0.01, k_max: 0.10 }
  heat_arrival_min: { k: 14.0, k_min: 5.0,  k_max: 26.0 }
  heat_bunching:    { k: 0.20, k_min: 0.08, k_max: 0.32 }
  heat_emergency:   { k: 0.85, k_min: 0.40, k_max: 1.60 }
  # High wind -> open-air operations.
  wind_service:     { k: 0.12, k_min: 0.05, k_max: 0.22 }
  wind_capacity:    { k: 0.10, k_min: 0.04, k_max: 0.18 }
  # Flooding -> localised access loss (applied to exposed entity TYPES).
  flood_capacity:   { k: 0.55, k_min: 0.35, k_max: 0.80 }
  flood_travel:     { k: 0.45, k_min: 0.25, k_max: 0.70 }

  # Uncertainty widening.
  horizon_widening_per_hour: 0.06
  low_confidence_after_sec: 10800

  # Rails on the composed vector, so no input can produce an absurd multiplier.
  limits:
    travel_time_mult: [1.0, 2.5]
    dwell_mult: [1.0, 2.2]
    service_rate_mult: [0.4, 1.0]
    attendance_mult: [0.5, 1.0]
    emergency_gain_mult: [1.0, 3.0]
    capacity_mult: [0.3, 1.0]
    arrival_shift_min: [0.0, 90.0]
    arrival_spread_mult: [0.6, 1.0]

# Public social signals (app/providers/social.py). Mastodon public hashtag
# timelines are readable WITHOUT an API key, which is why they are the default:
# the signals shown are real posts real people published.
#   provider: mastodon | fixture | none
#     mastodon  live public posts. Hashtags are derived from the ACTIVE world's
#               venue and city — never hardcoded. An empty result means nobody
#               posted, which is reported as such.
#     fixture   offline test data from app/data/social_fixture.json, always
#               labelled `fallback_fixture` / `is_real_post: false`. NOT posts.
#     none      the panel reports `unavailable`.
#   EVENTFLOW_SOCIAL_PROVIDER overrides `provider`.
social:
  provider: mastodon
  instance: "https://mastodon.social"
  weather_tags: [rain, flood, weather, heatwave, storm]
  max_tags: 5
  timeout_sec: 6.0
  retries: 1
  min_interval_sec: 0.5
  cache_ttl_sec: 300

# Static city data (app/providers/data.py). `file` reads events.json /
# hotels.json / topology.json from `dir` (each optional) and normalises them.
data:
  provider: synthetic
  dir: data

# Venue → radius → footprint → OSM → blueprint → event graph (app/geospatial/).
# Every capacity/speed below is a DOCUMENTED ESTIMATE used only when OSM or the
# organiser does not supply the value; the blueprint records which one was used
# (capacity_source / capacity_confidence, travel_time_source) on every entity.
geospatial:
  user_agent: "EventFlow-AI/1.0 (hackathon demo; +https://github.com/)"
  venue_providers: [coordinates, google_places, nominatim]   # google_places only with GOOGLE_PLACES_API_KEY
  nominatim_url: "https://nominatim.openstreetmap.org"
  nominatim_min_interval_sec: 1.1        # Nominatim policy: max 1 request/second
  overpass_endpoints:                    # trusted config only, tried in order
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.openstreetmap.fr/api/interpreter"
  overpass_min_interval_sec: 1.0
  timeout_sec: 60
  retries: 1
  cache_ttl_sec: 3600
  restore_active_world: true             # re-activate the last active blueprint on startup
  radius_min_m: 250
  radius_max_m: 5000
  radius_default_m: 2000
  road_classes: [motorway, trunk, primary, secondary, tertiary, unclassified,
                 motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
  builder:
    junction_merge_m: 20                 # OSM junctions closer than this are one operational junction
    min_component_nodes: 3               # smaller disconnected road fragments (clip artefacts) are dropped
    snap_max_m: 400                      # max connector length from a POI to the road graph
    gate_snap_max_m: 500
    gate_merge_m: 80                     # mapped entrances closer than this are one access point
    entrance_max_m: 250                  # mapped entrances up to this far outside the venue outline count (site gates)
    min_access_points: 4                 # fewer mapped entrances -> add road approaches for uncovered sectors
    gate_search_m: 350                   # road approaches this close to the venue can become access points
    max_gates: 8
    access_max_walk_m: 2500              # stations/parking beyond this walk are not direct arrival points
    bus_cluster_m: 250                   # bus stops closer than this form one bus-stop cluster
    station_merge_m: 150
    max_transit: 40                      # nearest N bus hubs / stop clusters (after clustering) — monotone in radius
    max_rail_stations: 20                # nearest N rail / metro stations, capped separately
    max_parking: 25
    max_hotels: 30
    max_emergency: 10
    max_nodes: 2500                      # a larger graph is rejected (reduce the radius)
    walk_speed_mps: 1.3
    drive_speed_mps: 8.0                 # urban door-to-door driving for emergency response times
    gate_choice_tau_sec: 300             # access→gate split: weight = exp(-walk_time / tau)
    road_people_per_lane_m: 2.5          # people-equivalent storage per metre of lane incl. its share of footway (~5 m x 0.5 p/m², estimate)
    lane_capacity_veh_per_min: 30        # ~1800 veh/h per lane (standard planning figure)
    class_speed_kmh: {motorway: 80, trunk: 60, primary: 45, secondary: 40, tertiary: 30, unclassified: 25,
                      motorway_link: 50, trunk_link: 40, primary_link: 35, secondary_link: 30, tertiary_link: 25}
    class_lanes: {motorway: 3, trunk: 2, primary: 2, secondary: 2, tertiary: 1, unclassified: 1,
                  motorway_link: 1, trunk_link: 1, primary_link: 1, secondary_link: 1, tertiary_link: 1}
    venue_people_per_m2: 1.2             # venue capacity from footprint area when no capacity is known
    venue_default_capacity: 20000
    gate_capacity_ratio: 0.2             # sum of gate capacities = ratio x venue capacity
    precinct_capacity_ratio: 0.25
    transit_capacity: {metro_station: 3000, rail_station: 4000, bus_station: 1500, bus_stop_cluster: 300}
    parking_m2_per_vehicle: 25
    parking_default_capacity: 100
    hotel_default_rooms: {hotel: 80, hostel: 25, guest_house: 10, motel: 40, apartment: 20}
    hotel_base_occupancy: 0.45           # non-event guests (model assumption, same for every property)
    emergency_capacity: {hospital: 150, police: 60, fire_station: 60, ambulance_station: 40}

# The event schedule. `event` below stays the primary event (GET /event).
events:
  - event_id: "evt_demo"
    name: "National Cup Final"
    category: "sport"
    venue_entity_id: "stadium_main"
    start_time: "2026-09-04T16:00:00Z"
    end_time: "2026-09-04T18:30:00Z"
    expected_attendance: 70000
    out_of_town_share: 0.30
  - event_id: "evt_fanfest"
    name: "Fan Festival"
    category: "festival"
    venue_entity_id: "zone_fanpark"
    start_time: "2026-09-04T15:00:00Z"
    end_time: "2026-09-04T19:30:00Z"
