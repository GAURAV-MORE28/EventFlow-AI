services:
  - type: web
    name: eventflow-backend
    runtime: docker
    plan: starter
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: EVENTFLOW_CONFIG
        value: config.yaml
      # Set this to your deployed frontend's exact origin once you have it,
      # e.g. https://eventflow-ai.vercel.app (no trailing slash, comma-separate
      # multiple origins). Without it only localhost is allowed.
      - key: EVENTFLOW_ALLOWED_ORIGINS
        value: ""
